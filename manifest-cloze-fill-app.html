function answerFor(i){if(!current?.answers?.length)return '此題尚未附文字答案';let a=String(current.answers[i]??'此題尚未附文字答案').trim();return a.replace(/^[\d\uFE0F\u20E3🔟️⃣\.、\)\s]+/u,'')||a}
function renderPracticeQuestion(){const q=practiceQuestions[practiceIndex]||[];$('#lines').innerHTML=`<section class="question-stage"><div class="question-progress">第 ${practiceIndex+1} 題／共 ${practiceQuestions.length} 題</div>${q.map(l=>`<div class="question-line ${isEnglish(l)?'en':''}">${esc(l)}</div>`).join('')}<div class="keyboard-note">按空白鍵顯示／隱藏本題答案</div></section>`;document.querySelectorAll('.question-line.en').forEach(l=>l.onclick=()=>speak(l.textContent));$('#answers').innerHTML=`<div class="answer-label">本題答案</div>${esc(answerFor(practiceIndex))}`;$('#answers').classList.remove('show');$('#prevQuestion').disabled=practiceIndex===0;$('#nextQuestion').disabled=practiceIndex>=practiceQuestions.length-1;$('#toggleAnswer').textContent='顯示本題答案（空白鍵）'}
openItem=function(x){current=x;practiceQuestions=parsePracticeQuestions(x.lines);practiceIndex=0;$('#readerTitle').textContent=x.title;$('#readerMeta').innerHTML=`<span>#${String(x.id).padStart(3,'0')}</span><span class="pill">${esc(x.category)}</span><span>${esc(x.subcategory)}</span>`;$('#toggleAnswer').style.display='inline-block';$('#hint').textContent='一次練習一題；點選英文句子可朗讀，按空白鍵只顯示目前這題的答案。';$('#hint').style.display='block';$('#modal').classList.add('open');document.body.style.overflow='hidden';renderPracticeQuestion()};
toggleAnswer=function(){$('#answers').classList.toggle('show');$('#toggleAnswer').textContent=$('#answers').classList.contains('show')?'隱藏本題答案（空白鍵）':'顯示本題答案（空白鍵）'};
const prev=document.createElement('button');prev.id='prevQuestion';prev.className='nav-button';prev.textContent='← 上一題';const next=document.createElement('button');next.id='nextQuestion';next.className='nav-button';next.textContent='下一題 →';$('#toggleAnswer').after(next);$('#toggleAnswer').after(prev);prev.onclick=()=>{if(practiceIndex>0){practiceIndex--;renderPracticeQuestion()}};next.onclick=()=>{if(practiceIndex<practiceQuestions.length-1){practiceIndex++;renderPracticeQuestion()}};$('#speakAll').textContent='▶ 朗讀本題英文';$('#speakAll').onclick=()=>{const q=practiceQuestions[practiceIndex]||[];const en=q.filter(isEnglish).join('. ');if(en)speak(en)};
</script></body></html>
