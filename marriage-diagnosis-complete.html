            padding: 0;

        :root {

            --teal: #0A7A72;
            --light-bg: #F8F6F1;
            --white: #FFFFFF;
            --text-dark: #2C2C2C;
            --text-light: #666666;
        }

        body {

            color: var(--text-dark);
            line-height: 1.8;
        }

        .container {
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* Sidebar Navigation */
        .sidebar {
            width: 260px;
            background-color: var(--navy);
            color: var(--white);
            overflow-y: auto;
            padding: 20px;
            border-right: 3px solid var(--gold);
        }

        .sidebar-title {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 25px;
            padding-bottom: 12px;
            border-bottom: 2px solid var(--gold);
        }

        .nav-item {
            padding: 12px 15px;
            margin-bottom: 8px;
            background-color: rgba(255, 255, 255, 0.1);
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 14px;
            border-left: 3px solid transparent;
        }

        .nav-item:hover {
            background-color: var(--gold);
            color: var(--navy);
            border-left-color: var(--gold);
        }

        .nav-item.active {
            background-color: var(--gold);
            color: var(--navy);
            font-weight: bold;
            border-left-color: var(--white);
        }

        /* Main Content Area */
        .content {
            flex: 1;
            overflow-y: auto;
            padding: 40px;
            background-color: var(--white);
        }

        .section {
            margin-bottom: 40px;
        }

        .section-title {
            font-size: 28px;
            font-weight: bold;
            color: var(--navy);
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 3px solid var(--gold);
        }

        .subsection-title {
            font-size: 20px;
            font-weight: bold;
            color: var(--teal);
            margin-top: 25px;
            margin-bottom: 15px;
        }

        /* Card Styling */
        .card {
            background-color: var(--light-bg);
            border-left: 4px solid var(--teal);
            padding: 20px;
            margin-bottom: 15px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .card:hover {
            box-shadow: 0 4px 12px rgba(10, 122, 114, 0.15);
            transform: translateX(4px);
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            user-select: none;
        }

        .card-title {
            font-weight: bold;
            color: var(--navy);
            font-size: 16px;
        }

        .card-toggle {
            font-size: 20px;
            color: var(--teal);
            transition: transform 0.3s ease;
        }

        .card.expanded .card-toggle {
            transform: rotate(180deg);
        }

        .card-content {
            display: none;
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px solid rgba(201, 150, 12, 0.3);
        }

        .card.expanded .card-content {
            display: block;
            animation: slideDown 0.3s ease;
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .bilingual-text {
            margin-bottom: 12px;
        }

        .chinese-text {
            color: var(--text-dark);
            margin-bottom: 8px;
            line-height: 1.8;
        }

        .english-text {
            color: var(--text-light);
            font-size: 14px;
            line-height: 1.7;
            font-style: italic;
        }

        /* Matrix Table */
        .matrix-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
            overflow-x: auto;
            display: block;
        }

        .matrix-table th {
            background-color: var(--navy);
            color: var(--white);
            padding: 12px;
            text-align: left;
            font-weight: bold;
            font-size: 13px;
        }

        .matrix-table td {
            padding: 12px;
            border-bottom: 1px solid #e0e0e0;
            font-size: 13px;
        }

        .matrix-table tr:hover {
            background-color: rgba(201, 150, 12, 0.05);
        }

        .problem-num {
            background-color: var(--gold);
            color: var(--navy);
            font-weight: bold;
            width: 40px;
            text-align: center;
            border-radius: 4px;
        }

        /* TTS Button */
        .tts-btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 6px 12px;
            background-color: var(--teal);
            color: var(--white);
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
            transition: background-color 0.3s ease;
            margin-left: 10px;
            vertical-align: middle;
        }

        .tts-btn:hover {
            background-color: #0A7A72;
        }

        .tts-btn.playing {
            background-color: var(--gold);
            color: var(--navy);
        }

        /* Search Bar */
        .search-container {
            margin-bottom: 25px;
            display: flex;
            gap: 10px;
        }

        .search-input {
            flex: 1;
            padding: 12px;
            border: 2px solid var(--teal);
            border-radius: 6px;
            font-family: inherit;
            font-size: 14px;
            transition: border-color 0.3s ease;
        }

        .search-input:focus {
            outline: none;
            border-color: var(--gold);
        }

        /* Modal */
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
        }

        .modal.show {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .modal-content {
            background-color: var(--white);
            padding: 30px;
            border-radius: 8px;
            max-width: 600px;
            max-height: 80vh;
            overflow-y: auto;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
        }

        .close {
            color: var(--text-light);
            float: right;
            font-size: 28px;
            font-weight: bold;
            cursor: pointer;
            line-height: 20px;
        }

        .close:hover {
            color: var(--navy);
        }

        /* Responsive */
        @media (max-width: 768px) {
            .container {
                flex-direction: column;
            }

            .sidebar {
                width: 100%;
                height: auto;
                max-height: 200px;
                border-right: none;
                border-bottom: 3px solid var(--gold);
                display: flex;
                gap: 10px;
                overflow-x: auto;
                padding: 15px;
            }

            .sidebar-title {
                display: none;
            }

            .nav-item {
                white-space: nowrap;
                padding: 8px 12px;
                margin-bottom: 0;
                font-size: 12px;
            }

            .content {
                padding: 20px;
            }

            .section-title {
                font-size: 22px;
            }
        }

        .footer {
            margin-top: 40px;
            padding-top: 20px;
            border-top: 2px solid var(--gold);
            text-align: center;
            color: var(--text-light);
            font-size: 13px;
        }
    </style>
</head>

            const utterance = new SpeechSynthesisUtterance(text);

            utterance.rate = 0.85;
            utterance.pitch = 1;
            utterance.volume = 1;

            buttonElement.classList.add('playing');
            currentSpeaking = buttonElement;

            utterance.onend = () => {
                buttonElement.classList.remove('playing');
                currentSpeaking = null;
            };

            speechSynthesis.speak(utterance);
        }
