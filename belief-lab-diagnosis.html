:block;color:var(--muted);font:italic 13px Georgia;margin-top:5px}.hero aside .new{color:var(--green);font-weight:bold}.page{padding:80px 6vw;min-height:80vh;background:var(--paper)}.title{max-width:900px}.title h1{font-size:clamp(40px,6vw,72px);line-height:1;letter-spacing:-3px;margin:12px 0}.title>p:last-child{font:italic 17px Georgia;color:var(--muted)}.questions,.cards,.models{display:grid;grid-template-columns:repeat(4,1fr);margin-top:40px}.questions button{border:0;border-top:1px solid;border-right:1px solid var(--line);background:transparent;text-align:left;padding:25px;min-height:160px}.questions button:hover{background:var(--lime)}.questions b,.questions strong,.questions small{display:block}.questions b{font:11px monospace;color:var(--orange);margin-bottom:30px}.questions small{font:italic 13px Georgia;color:var(--muted);margin-top:7px}.loop{background:var(--ink);color:white;padding:70px 6vw}.loop .eyebrow{color:var(--lime)}.loopgrid{display:grid;grid-template-columns:repeat(6,1fr);margin-top:35px}.loopgrid span{text-align:center}.loopgrid b{display:grid;place-items:center;width:34px;height:34px;background:var(--lime);color:var(--ink);border-radius:50%;margin:auto}.loopgrid strong,.loopgrid small{display:block;margin-top:9px}.loopgrid small{color:#9daba3}.cards{grid-template-columns:repeat(3,1fr);gap:12px}.card{background:#eeece3;padding:23px;min-height:205px;cursor:pointer}.card:hover{box-shadow:7px 7px var(--lime)}.card>b{font:11px monospace;color:var(--orange)}.card h3{font-size:21px;margin:28px 0}.card p{font-size:13px;color:var(--muted)}.card>strong{display:block;border-top:1px solid var(--line);padding-top:12px;color:var(--green);font-size:13px}.filters{display:flex;align-items:center;gap:12px;border-top:1px solid;border-bottom:1px solid var(--line);padding:15px 0;margin-top:40px}.filters input{padding:10px;border:1px solid var(--line);min-width:250px}.chips{display:flex;gap:5px;flex-wrap:wrap}.chips button{border:1px solid var(--line);border-radius: </style></head><body><header><div class="brand"><b>BELIEF LAB</b><small>信念實驗室</small></div><nav><button data-view="home" class="on">首頁<small>Today</small></button><button data-view="library">診斷庫<small>50 Cases</small></button><button data-view="update">更新器<small>Updater</small></button><button data-view="map">知識地圖<small>Map</small></button></nav><div class="tools"><select id="lang"><option value="both">中 EN</option><option value="zh">中文</option><option value="en">English</option></select><button class="listen" data-say="Beliefs are temporary models. Stable enough to act, flexible enough to update.">◖ English</button></div></header><main id="app"></main><footer class="foot"><b>BELIEF LAB</b><span>信念是暫時模型，不是真理，也不是敵人。</span><small>Beliefs are temporary models—not truths, and not enemies.</small></footer><script>
const DATA=[{"id":1,"d":"Self","z":"不敢嘗試","e":"Afraid to try","bz":"我做不到","be":"I can't do it","mz":"過去失敗被泛化","me":"Past failures were generalized","nz":"行動資料不足","ne":"Not enough action data","az":"做 5 分鐘小測試","ae":"Run a five-minute test"},{"id":2,"d":"Self","z":"害怕失敗","e":"Fear of failure","bz":"失敗很丟臉","be":"Failure is humiliating","mz":"結果綁定自我價值","me":"Outcomes are tied to self-worth","nz":"容錯不足","ne":"Low tolerance for error","az":"做一次低成本試錯","ae":"Try one low-cost experiment"},{"id":3,"d":"Self","z":"完美主義","e":"Perfectionism","bz":"不完美就不好","be":"Imperfect means bad","mz":"錯誤被視為威脅","me":"Errors feel threatening","nz":"完成門檻太高","ne":"Completion bar is too high","az":"先交 80 分版本","ae":"Submit the 80% version first"},{"id":4,"d":"Self","z":"拖延","e":"Procrastination","bz":"做不好不如不做","be":"If I can't do it well, don't do it","mz":"逃避保護自尊","me":"Avoidance protects self-esteem","nz":"啟動成本高","ne":"High activation cost","az":"只完成第一步","ae":"Complete only the first step"},{"id":5,"d":"Relationship","z":"不敢問問題","e":"Afraid to ask questions","bz":"問問題代表笨","be":"Asking means I'm stupid","mz":"社會評價威脅","me":"Threat of social judgment","nz":"求助能力不足","ne":"Weak help-seeking skill","az":"今天問一題","ae":"Ask one question today"},{"id":6,"d":"Relationship","z":"不敢拒絕","e":"Afraid to say no","bz":"拒絕會失去關係","be":"Saying no will cost the relationship","mz":"歸屬需求過強","me":"Overweighted need to belong","nz":"邊界不足","ne":"Weak boundaries","az":"拒絕一件小事","ae":"Decline one small request"},{"id":7,"d":"Relationship","z":"一直討好","e":"People-pleasing","bz":"別人開心我才安全","be":"I'm safe only when others are happy","mz":"外部評價控制","me":"Controlled by external approval","nz":"自我判準不足","ne":"Weak internal criteria","az":"說一次真實需求","ae":"State one honest need"},{"id":8,"d":"Self","z":"被批評就崩潰","e":"Collapse under criticism","bz":"被批評代表我不好","be":"Criticism means I am bad","mz":"事件被人格化","me":"An event becomes identity","nz":"身份綁定結果","ne":"Identity tied to outcomes","az":"分開人與行為","ae":"Separate the person from the behavior"},{"id":9,"d":"Relationship","z":"怕別人不喜歡","e":"Fear of being disliked","bz":"被喜歡才有價值","be":"Being liked gives me value","mz":"認可迴路","me":"Validation loop","nz":"價值外包","ne":"Outsourced self-worth","az":"做一件自己認同的事","ae":"Do one thing you endorse"},{"id":10,"d":"Success","z":"容易嫉妒","e":"Jealousy","bz":"別人贏就是我輸","be":"Their win is my loss","mz":"零和模型","me":"Zero-sum model","nz":"資源模型過窄","ne":"Narrow resource model","az":"找出可學習資訊","ae":"Extract one useful lesson"},{"id":11,"d":"Success","z":"不敢競爭","e":"Afraid to compete","bz":"我不可能贏","be":"I could never win","mz":"未測試就預測失敗","me":"Failure predicted before testing","nz":"樣本不足","ne":"Insufficient samples","az":"參加一次低風險挑戰","ae":"Join one low-risk challenge"},{"id":12,"d":"Success","z":"一次失敗就放棄","e":"Quit after one failure","bz":"我沒有天分","be":"I have no talent","mz":"固定型模型","me":"Fixed-trait model","nz":"更新不足","ne":"Insufficient updating","az":"找出可訓練變數","ae":"Find one trainable variable"},{"id":13,"d":"Change","z":"不願改方法","e":"Refuse to change methods","bz":"以前都這樣做","be":"This is how I've always done it","mz":"舊成功持續強化","me":"Past success over-reinforces","nz":"模型僵化","ne":"Model rigidity","az":"測試一個新方法","ae":"Test one new method"},{"id":14,"d":"Change","z":"很難接受錯誤","e":"Cannot accept mistakes","bz":"犯錯代表能力差","be":"Errors mean low ability","mz":"身份防衛","me":"Identity defense","nz":"拒絕預測誤差","ne":"Prediction error rejected","az":"每天記一個修正","ae":"Log one correction each day"},{"id":15,"d":"Self","z":"不願承認不知道","e":"Cannot admit not knowing","bz":"不知道很丟臉","be":"Not knowing is shameful","mz":"知識綁定自尊","me":"Knowledge tied to ego","nz":"探索被阻斷","ne":"Exploration is blocked","az":"說一次「我不知道」","ae":"Say “I don't know” once"},{"id":16,"d":"Self","z":"總想證明自己","e":"Always proving yourself","bz":"證明自己才有價值","be":"I need proof to have value","mz":"自我價值不穩","me":"Unstable self-worth","nz":"防衛成本高","ne":"High defense cost","az":"把證明改成確認資訊","ae":"Replace proving with checking"},{"id":17,"d":"Success","z":"一直比較","e":"Constant comparison","bz":"我要比別人好","be":"I must be better than others","mz":"外部排序模型","me":"External ranking model","nz":"自我基準不足","ne":"No internal benchmark","az":"比較自己的前後資料","ae":"Compare your own before-and-after data"},{"id":18,"d":"Success","z":"害怕落後","e":"Fear of falling behind","bz":"慢就是失敗","be":"Slow means failure","mz":"單一時間表","me":"Single-timeline model","nz":"忽略個體差異","ne":"Variation is ignored","az":"比較長期趨勢","ae":"Compare long-term trends"},{"id":19,"d":"Success","z":"覺得讀書很苦","e":"Learning feels painful","bz":"學習就是被要求","be":"Learning means being forced","mz":"過去外控經驗","me":"History of external control","nz":"自主性不足","ne":"Low autonomy","az":"自選一個學習目標","ae":"Choose one learning goal yourself"},{"id":20,"d":"Success","z":"覺得自己英文不好","e":"I am bad at English","bz":"我沒有語言天分","be":"I have no language talent","mz":"分數被人格化","me":"Scores became identity","nz":"能力拆解不足","ne":"Skills are not decomposed","az":"找出真正弱節點","ae":"Find the actual weak skill node"},{"id":21,"d":"Success","z":"考差就否定自己","e":"Bad grades destroy self-worth","bz":"分數等於價值","be":"My score equals my worth","mz":"指標綁定身份","me":"A metric is tied to identity","nz":"評價模型錯誤","ne":"Faulty evaluation model","az":"把錯題當回饋","ae":"Treat wrong answers as feedback"},{"id":22,"d":"Change","z":"不敢轉換跑道","e":"Afraid to change paths","bz":"改變讓過去白費","be":"Change wastes my past","mz":"沉沒成本","me":"Sunk-cost effect","nz":"更新成本過高","ne":"High updating cost","az":"做低成本探索","ae":"Run a low-cost exploration"},{"id":23,"d":"Change","z":"工作不敢改變","e":"Afraid to change jobs","bz":"穩定最安全","be":"Stability is always safest","mz":"損失權重過高","me":"Losses are overweighted","nz":"選項不足","ne":"Too few options","az":"建立第二選項","ae":"Build a second option"},{"id":24,"d":"Money","z":"覺得錢很難賺","e":"Money is hard to earn","bz":"財富只能靠辛苦交換","be":"Wealth only comes from hard labor","mz":"單一收入模型","me":"Single-income model","nz":"價值模型過窄","ne":"Narrow value model","az":"找一種可放大的價值","ae":"Find one scalable form of value"},{"id":25,"d":"Money","z":"不敢談錢","e":"Afraid to discuss money","bz":"談錢很俗","be":"Talking about money is vulgar","mz":"金錢道德化","me":"Money is moralized","nz":"價值交換模型不足","ne":"Weak value-exchange model","az":"練習說明自己的價值","ae":"Practice explaining your value"},{"id":26,"d":"Money","z":"不敢收費","e":"Afraid to charge","bz":"收錢是占便宜","be":"Charging is taking advantage","mz":"利他與交換被二分","me":"Service and exchange are split","nz":"商業模型不足","ne":"Weak business model","az":"計算真實服務成本","ae":"Calculate the real service cost"},{"id":27,"d":"Money","z":"有錢就罪惡","e":"Wealth feels guilty","bz":"財富代表自私","be":"Wealth means selfishness","mz":"金錢人格化","me":"Money becomes a character verdict","nz":"資源觀失真","ne":"Distorted resource model","az":"問錢能放大什麼價值","ae":"Ask what value money can amplify"},{"id":28,"d":"Money","z":"花錢焦慮","e":"Spending anxiety","bz":"花錢就是失去","be":"Spending means losing","mz":"損失規避","me":"Loss aversion","nz":"投資分類不足","ne":"Poor spending categories","az":"分清消費與投資","ae":"Separate consumption from investment"},{"id":29,"d":"Relationship","z":"婚姻一直忍耐","e":"Endless endurance in marriage","bz":"愛就是忍耐","be":"Love means endurance","mz":"犧牲被等同於愛","me":"Sacrifice equals love","nz":"邊界不足","ne":"Weak boundaries","az":"清楚表達一個需求","ae":"Clearly state one need"},{"id":30,"d":"Relationship","z":"害怕衝突","e":"Fear of conflict","bz":"衝突會讓關係破裂","be":"Conflict destroys relationships","mz":"衝突模型失真","me":"Distorted conflict model","nz":"修復能力不足","ne":"Weak repair skills","az":"討論一件小分歧","ae":"Discuss one small disagreement"},{"id":31,"d":"Relationship","z":"想改變伴侶","e":"Trying to change a partner","bz":"對方改變我才會好","be":"I'll be okay only if they change","mz":"控制權外包","me":"Control is outsourced","nz":"可控節點錯置","ne":"Control point misplaced","az":"先處理自己的邊界","ae":"Work on your boundary first"},{"id":32,"d":"Relationship","z":"被冷落就否定自己","e":"Neglect destroys self-worth","bz":"不被愛就是沒價值","be":"Unloved means worthless","mz":"他人行為定義自己","me":"Others define the self","nz":"自我價值外包","ne":"Outsourced self-worth","az":"分開對方能力與自身價值","ae":"Separate their capacity from your value"},{"id":33,"d":"Relationship","z":"受傷後不再信任","e":"No trust after relational hurt","bz":"人都不可靠","be":"People are all unreliable","mz":"單次經驗泛化","me":"One experience generalized","nz":"樣本偏差","ne":"Sample bias","az":"建立分級信任","ae":"Build graduated trust"},{"id":34,"d":"Relationship","z":"不敢交朋友","e":"Afraid to make friends","bz":"我一定會被拒絕","be":"I will certainly be rejected","mz":"威脅預測","me":"Threat prediction","nz":"現實資料不足","ne":"Insufficient real-world data","az":"主動打一個招呼","ae":"Initiate one greeting"},{"id":35,"d":"Relationship","z":"孩子應該聽話","e":"Children should obey","bz":"好孩子就是服從","be":"A good child is obedient","mz":"控制型教育模型","me":"Control-based parenting","nz":"自主生成不足","ne":"Autonomy cannot develop","az":"讓孩子做一個選擇","ae":"Let the child make one choice"},{"id":36,"d":"Relationship","z":"父母什麼都代辦","e":"Parents do everything","bz":"他自己做會失敗","be":"They will fail on their own","mz":"保護模型過強","me":"Overprotective model","nz":"回饋被阻斷","ne":"Feedback is blocked","az":"放手一件低風險任務","ae":"Release one low-risk task"},{"id":37,"d":"Success","z":"老師一定要給答案","e":"Teachers must give answers","bz":"學習就是被教","be":"Learning means being taught","mz":"外部控制模型","me":"External-control model","nz":"主體性不足","ne":"Low agency","az":"自己先提出假設","ae":"Propose your hypothesis first"},{"id":38,"d":"World","z":"覺得 AI 會讓人變笨","e":"AI makes people stupid","bz":"工具會取代能力","be":"Tools replace ability","mz":"工具模型單一","me":"One-dimensional tool model","nz":"使用方式錯誤","ne":"Faulty usage pattern","az":"先思考再問 AI","ae":"Think first, then ask AI"},{"id":39,"d":"World","z":"覺得 AI 什麼都知道","e":"AI knows everything","bz":"AI 就是權威","be":"AI is an authority","mz":"流暢度被當成真實","me":"Fluency mistaken for truth","nz":"驗證不足","ne":"Insufficient verification","az":"查一個重要答案來源","ae":"Verify one important answer"},{"id":40,"d":"Health","z":"身體不舒服就恐慌","e":"Panic at physical symptoms","bz":"症狀就是嚴重疾病","be":"A symptom means severe disease","mz":"威脅模型放大","me":"Threat model amplified","nz":"資料不足","ne":"Insufficient data","az":"記錄症狀，必要時就醫","ae":"Log symptoms and seek 一個違反舊預測的小行動","ae":"Take one action against the old prediction"},{"id":49,"d":"Change","z":"覺得年紀大不能改","e":"Too old to change","bz":"現在太晚了","be":"It's too late","mz":"時間模型僵化","me":"Rigid time model","nz":"未來探索停止","ne":"Future exploration stops","az":"學一個新能力","ae":"Learn one new skill"},{"id":50,"d":"Change","z":"不知道如何改信念","e":"Don't know how to change beliefs","bz":"靠說服自己就好","be":"I only need to convince myself","mz":"語言缺少現實證據","me":"Words lack real evidence","nz":"預測誤差不足","ne":"Not enough prediction error","az":"設計一個小實驗","ae":"Design one small experiment"}];const DZ={All:'全部',Self:'自我',Relationship:'關係',Success:'成功／學習',Money:'金錢',Health:'健康',World:'世界／AI',Change:'改變'};let view='home',domain='All',query='',pick=DATA[47],lang='both';const app=document.querySelector('#app');
function esc(s=''){return s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}function speak(t){speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='en-US';u.rate=.9;speechSynthesis.speak(u)}function audio(t){return '<button class="speak" data-say="'+esc(t)+'">◖</button>'}function title(k,z,e){return '<div class="title"><p class="eyebrow">'+k+'</p><h1>'+z+'</h1><p>'+e+'</p></div>'}function choose(id){pick=DATA.find(x=>x.id===id);view='update';render();window.scrollTo(0,0)}
function home(){return '<section class="hero"><div><p class="eyebrow">BELIEF × PROBLEM DIAGNOSIS</p><h1><span class="zh">信念不是你。</span><em class="en">You are not your beliefs. '+audio('You are not your beliefs.')+'</em></h1><p class="lead"><span class="zh">信念是大腦根據過去資料建立的高權重預測模型；它可以被現實重新校準。</span><span class="en">A belief is a high-weight prediction model built from past data. Reality can recalibrate it.</span></p><button class="primary" data-go="update">開始 5 分鐘更新 · Start now →</button><button class="ghost" data-go="library">探索 50 個診斷</button></div><aside><label>CORE MODEL</label><p>「我就是這樣」<small>“This is just who I am.”</small></p><i>↓</i><p class="new">「這是暫時模型」<small>“This is a temporary model.”</small></p><footer>● Reality interface open</footer></aside></section><section class="page">'+title("TODAY'S CALIBRATION",'首頁只回答四件事','Four questions turn reflection into action.')+'<div class="questions">'+[['現在卡在哪裡？','Where are you stuck?'],['背後可能是哪句信念？','What belief may be underneath?'],['它正在讓你避免什麼？','What is it making you avoid?'],['今天只測試哪件事？','What one thing will you test today?']].map((x,i)=>'<button data-go="update"><b>0'+(i+1)+'</b><strong>'+x[0]+'</strong><small>'+x[1]+'</small></button>').join('')+'</div></section><section class="loop">'+title('THE UPDATE LOOP','真正改變不是口號，是回饋迴路。','Change is not an affirmation. It is a feedback loop.')+'<div class="loopgrid">'+[['舊信念','Old belief'],['預測','Prediction'],['小實驗','Small test'],['回饋','Feedback'],['預測誤差','Prediction error'],['模型更新','Model update']].map((x,i)=>'<span><b>'+(i+1)+'</b><strong>'+x[0]+'</strong><small>'+x[1]+'</small></span>').join('')+'</div></section><section class="page">'+title('PRIORITY NODES','從高槓桿節點開始','Update one root model, change many downstream actions.')+'<div class="cards">'+DATA.slice(0,6).map(card).join('')+'</div></section>'}function card(c){return '<article class="card" data-case="'+c.id+'"><b>'+String(c.id).padStart(2,'0')+' · '+DZ[c.d]+'</b><h3>'+c.z+'<small>'+c.e+'</small></h3><p>舊模型 · '+c.bz+'</p><strong>最小介入 · '+c.az+' →</strong></article>'}
function library(){let list=DATA.filter(c=>(domain==='All'||c.d===domain)&&Object.values(c).join(' ').toLowerCase().includes(query.toLowerCase()));return '<section class="page">'+title('DIAGNOSIS LIBRARY · 50 CASES','找出反覆卡住你的模式','Search behavior, belief, mechanism, or bottleneck.')+'<div class="filters"><input id="search" value="'+esc(query)+'" placeholder="搜尋／Search…"><div class="chips">'+Object.keys(DZ).map(d=>'<button data-domain="'+d+'" class="'+(domain===d?'on':'')+'">'+DZ[d]+'</button>').join('')+'</div><b class="count">'+list.length+'/50</b></div><div>'+list.map(c=>'<article class="row" data-case="'+c.id+'"><span class="cell"><b>'+String(c.id).padStart(2,'0')+'</b><strong>'+c.z+'</strong><small>'+c.e+'</small></span><span class="cell"><strong>'+c.bz+'</strong><small>'+c.be+'</small></span><span class="cell"><strong>'+c.mz+'</strong><small>'+c.me+'</small></span><span class="cell"><strong>'+c.nz+'</strong><small>'+c.ne+'</small></span><span class="cell action"><strong>'+c.az+'</strong><small>'+c.ae+' '+audio(c.ae)+'</small></span></article>').join('')+'</div></section>'}
function update(){const saved=JSON.parse(localStorage.getItem('belief-lab')||'{}'),fields=[['stuck','現在卡在哪裡？','Where are you stuck?',pick.z],['belief','我正在相信什麼？','What am I believing?',pick.bz],['avoid','它讓我避免什麼？','What is it making me avoid?',''],['prediction','舊模型預測什麼？','What does the old model predict?',''],['test','最低風險的測試？','What is the lowest-risk test?',pick.az],['actual','真正發生了什麼？','What actually happened?',''],['modelUpdate','模型要更新哪裡？','How should the model update?','']];return '<section class="page">'+title('HIGH AGENCY UPDATER','用現實，更新一個信念','One belief. One prediction. One safe test. Then let reality speak.')+'<div class="updater"><aside class="side"><p class="eyebrow">SUGGESTED CASE</p><h2>'+pick.z+'<small>'+pick.e+'</small></h2><label>舊信念 · OLD BELIEF</label><p>'+pick.bz+'<small>'+pick.be+'</small></p><label>瓶頸 · BOTTLENECK</label><p>'+pick.nz+'<small>'+pick.ne+'</small></p><label>最小介入 · INTERVENTION</label><p>'+pick.az+'<small>'+pick.ae+' '+audio(pick.ae)+'</small></p><button data-go="library">從診斷庫選其他案例</button></aside><div class="form">'+fields.map((x,i)=>'<label class="step"><b>'+(i+1)+'</b><span>'+x[1]+'<small>'+x[2]+' '+audio(x[2])+'</small></span><textarea data-field="'+x[0]+'" placeholder="寫下觀察 / Write your observation">'+esc(saved[x[0]]??x[3])+'</textarea></label>').join('')+'<div class="save"><button class="primary" id="save">儲存本機紀錄 · Save locally</button><span id="status"></span><button class="clear" id="clear">清除</button></div></div></div></section>'}
function map(){const models=[['Self','自我','Who am I? Am I capable and worthy?'],['Other','他人','Can others be trusted?'],['World','世界','Is the world safe, fair, opportunity or threat?'],['Relationship','關係','What do love, conflict and rejection mean?'],['Success','成功','Does success come from effort, talent, strategy or luck?'],['Money','金錢','Does money mean safety, guilt, power or exchange?'],['Health','健康','What is controllable and when is care needed?'],['Change','改變','Is error failure or updating data?']];const lev=[['Notice','看見'],['Separate','分開事實與模型'],['Origin','理解來源'],['Function','理解保護功能'],['Cost','計算今天成本'],['Prediction','找出預測'],['Experiment','設計小實驗'],['Feedback','讓現實說話'],['Update','降低舊權重'],['Retest','反覆校準']];return '<section class="page">'+title('BELIEF INTELLIGENCE MAP','建立可被現實校準的信念系統','From belief formation to self-updating agency.')+'<section class="block"><p class="eyebrow">01 · STRUCTURE</p><h2>八大信念模型</h2><div class="models">'+models.map((x,i)=>'<article class="model"><b>0'+(i+1)+'</b><h3>'+x[1]+'<small>'+x[0]+' Model '+audio(x[0]+' model. '+x[2])+'</small></h3><p class="en">'+x[2]+'</p></article>').join('')+'</div></section><section class="block"><p class="eyebrow">02 · LEVERS</p><h2>信念更新的十大槓桿</h2><div class="levers">'+lev.map((x,i)=>'<span class="lever"><b>'+String(i+1).padStart(2,'0')+'</b><strong>'+x[1]+'</strong><small>'+x[0]+'</small></span>').join('')+'</div></section><section class="block"><p class="eyebrow">03 · FORMULA</p><h2>現實校準公式</h2><div class="loop"><p>信念更新 ≈ 新證據 × 預測誤差 × 安全測試 × 重複驗證</p><small>Updating ≈ evidence × prediction error × safe testing × repeated verification</small></div></section><blockquote class="quote"><p>真正成熟的信念，不是永遠不動搖。</p><h2>穩定到足以行動，柔軟到可以更新。</h2><small>A mature belief is stable enough to act on, and flexible enough to update.</small>'+audio('A mature belief is stable enough to act on, and flexible enough to update.')+'</blockquote></section>'}
function bind(){document.querySelectorAll('[data-go]').forEach(x=>x.onclick=()=>{view=x.dataset.go;render();scrollTo(0,0)});document.querySelectorAll('[data-case]').forEach(x=>x.onclick=e=>{if(e.target.closest('[data-say]'))return;choose(+x.dataset.case)});document.querySelectorAll('[data-say]').forEach(x=>x.onclick=e=>{e.stopPropagation();speak(x.dataset.say)});document.querySelectorAll('[data-domain]').forEach(x=>x.onclick=()=>{domain=x.dataset.domain;render()});let s=document.querySelector('#search');if(s)s.oninput=e=>{query=e.target.value;libraryRefresh()};let save=document.querySelector('#save');if(save)save.onclick=()=>{let o={};document.querySelectorAll('[data-field]').forEach(x=>o[x.dataset.field]=x.value);localStorage.setItem('belief-lab',JSON.stringify(o));document.querySelector('#status').textContent='✓ 已儲存在此裝置'};let clear=document.querySelector('#clear');if(clear)clear.onclick=()=>{localStorage.removeItem('belief-lab');document.querySelectorAll('[data-field]').forEach(x=>x.value='');document.querySelector('#status').textContent='已清除'}}function libraryRefresh(){app.innerHTML=library();applyLang();bind();document.querySelector('#search')?.focus()}function applyLang(){document.querySelectorAll('.zh').forEach(x=>x.classList.toggle('hidden',lang==='en'));document.querySelectorAll('.en').forEach(x=>x.classList.toggle('hidden',lang==='zh'))}function render(){app.innerHTML=view==='home'?home():view==='library'?library():view==='update'?update():map();document.querySelectorAll('nav button').forEach(x=>x.classList.toggle('on',x.dataset.view===view));applyLang();bind()}document.querySelectorAll('nav button').forEach(x=>x.onclick=()=>{view=x.dataset.view;render();scrollTo(0,0)});document.querySelector('#lang').onchange=e=>{lang=e.target.value;applyLang()};document.querySelectorAll('[data-say]').forEach(x=>x.onclick=()=>speak(x.dataset.say));render();
</script></body></html>
