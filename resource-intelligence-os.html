</style></head><body><header><nav><div class="logo"><b>R</b><span>RESOURCE INTELLIGENCE<small>資源智慧 OS</small></span></div><button class="listen" onclick="say('Resource Intelligence. Turn what you already have into future options.')">🔊 English</button></nav><div class="hero"><label>RESOURCE × PROBLEM DIAGNOSIS</label><h1>不是擁有更多。<br><em>是重新配置已有的一切。</em></h1><p>Not about owning more. Identify, allocate, convert, compound, and regenerate what you already have.</p><div class="tabs"><button class="on" data-tab="diagnose">診斷 Diagnosis</button><button data-tab="cases">50 案例 Cases</button><button data-tab="resources">20 資源 Resources</button><button data-tab="algorithm">演算法 Algorithm</button></div></div></header><main id="app"></main><footer><b>R</b><p>資源自由，是資源有限時，仍知道最值得投入的節點。<span>Resource freedom is knowing where to invest—even when resources are limited.</span></p></footer><script>
